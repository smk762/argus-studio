name: CI

# The PR gate for frontend/: lint, typecheck and the vitest unit tests over the
# pure logic in src/lib (wire seams, capability gates, runtime config). The
# release workflow only builds the image, so before this nothing failed a PR
# that broke one of those contracts (argus-studio#64).

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same Node as the image's base (frontend/Dockerfile).
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Fails if src/lib/generated has drifted from the schemas in schema/pins.json.
      - run: npm run wire:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

  # The static demo export (studio.dragonhound.dev) must not scroll sideways on
  # a phone: every route at 390 px, light and dark, plus no console errors or
  # CSP violations, and the shared theme script (dh-theme.js) must run, toggle and
  # apply a saved choice before first paint. Playwright is installed here only;
  # the app doesn't depend on it.
  static-overflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build:static

      - run: npm install --no-save playwright@1.65.0 && npx playwright install --with-deps chromium

      - run: node scripts/check-overflow.mjs out --width=390

  # The Dragonhound shared design layer (frontend/vendor/dh) is vendored from
  # dragonhound-site/shared and must not be edited here. Fails if a vendored file
  # changed locally or no longer matches the published v1 manifest; a newer
  # upstream version is only a warning (re-sync in its own PR).
  dh-shared:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - run: node frontend/vendor/dh/sync-shared.mjs --check . --against https://dragonhound.dev/brand/v1/manifest.json --allow-outdated
