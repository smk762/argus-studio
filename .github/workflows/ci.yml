name: CI

# The PR gate for frontend/: lint, typecheck and the vitest unit tests over the
# pure logic in src/lib (wire seams, capability gates, runtime config). The
# release workflow only builds the image, so before this nothing failed a PR
# that broke one of those contracts (argus-studio#64).

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same Node as the image's base (frontend/Dockerfile).
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Fails if src/lib/generated has drifted from the schemas in schema/pins.json.
      - run: npm run wire:check

      - run: npm run lint

      - run: npm run typecheck

      # Includes the docs opsec gate (src/lib/docsOpsec.test.ts). The private
      # denylist is a secret, never committed; it is empty on fork PRs.
      - run: npm test
        env:
          DOCS_OPSEC_DENYLIST: ${{ secrets.DOCS_OPSEC_DENYLIST }}

  # The static demo export (studio.dragonhound.dev) must not scroll sideways on
  # a phone: every route at 390 px, light and dark, plus no console errors or
  # CSP violations, and the shared theme script (dh-theme.js) must run, toggle and
  # apply a saved choice before first paint. Playwright is installed here only;
  # the app doesn't depend on it.
  static-overflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build:static

      - run: npm install --no-save playwright@1.65.0 && npx playwright install --with-deps chromium

      - run: node scripts/check-overflow.mjs out --width=390

  # Property-based UI testing (Bombadil, argus-studio#240/#241). Where
  # static-overflow loads each route once, this drives a browser around the
  # static export at random for 3 minutes, with clicks, typing, scrolling,
  # back/reload and resizes, and checks frontend/bombadil/spec.ts in every state.
  # Not required yet: continue-on-error stays until about two weeks of runs
  # without a spurious failure.
  bombadil:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build:static

      # The same resolver check-overflow.mjs uses (trailingSlash routes, 404 for
      # anything missing). It keeps running for the rest of the job.
      - name: Serve the export on :4173
        run: |
          node scripts/static-server.mjs out --port=4173 > "$RUNNER_TEMP/static-server.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/static-server.log"
          exit 1

      # v3 runs Bombadil 0.7 (v2 runs 0.6); `version` matches the devDependency
      # that types the spec.
      - name: Bombadil
        id: bombadil
        uses: antithesishq/bombadil-action@d4f3fa478dfd54605f544d2c0d5f0fcfdeeec893 # v3
        with:
          version: 0.7.10
          origin: http://127.0.0.1:4173/
          specification: ./frontend/bombadil/spec.ts
          time-limit: 3m
          exit-on-violation: true
          output-path: ${{ github.workspace }}/bombadil-output

      - name: Upload the trace
        if: failure() && steps.bombadil.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: bombadil-output
          path: ${{ github.workspace }}/bombadil-output
          retention-days: 14

      - name: How to replay it
        if: failure() && steps.bombadil.outcome == 'failure'
        run: |
          {
            echo "## Bombadil found a property violation"
            echo
            echo "The violated property and the actions before it are in the **Bombadil** step's log."
            echo "To replay it, download the \`bombadil-output\` artifact into \`frontend/\` and run:"
            echo
            echo '```sh'
            echo 'npm run build:static && node scripts/static-server.mjs out --port=4173 &'
            echo 'npx bombadil browser inspect bombadil-output    # step through the trace'
            echo "npx bombadil browser test http://127.0.0.1:4173/ bombadil/spec.ts --headless --no-sandbox --reproduce bombadil-output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The Dragonhound shared design layer (frontend/vendor/dh) is vendored from
  # dragonhound-site/shared and must not be edited here. Fails if a vendored file
  # changed locally or no longer matches the published v1 manifest; a newer
  # upstream version is only a warning (re-sync in its own PR).
  dh-shared:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - run: node frontend/vendor/dh/sync-shared.mjs --check . --against https://dragonhound.dev/brand/v1/manifest.json --allow-outdated
