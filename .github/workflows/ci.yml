name: CI

# The PR gate for frontend/: lint, typecheck and the vitest unit tests over the
# pure logic in src/lib (wire seams, capability gates, runtime config). The
# release workflow only builds the image, so before this nothing failed a PR
# that broke one of those contracts (argus-studio#64).

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same Node as the image's base (frontend/Dockerfile).
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Fails if src/lib/generated has drifted from the schemas in schema/pins.json.
      - run: npm run wire:check

      - run: npm run lint

      - run: npm run typecheck

      # Includes the docs opsec gate (src/lib/docsOpsec.test.ts). The private
      # denylist is a secret, never committed. On Actions an empty one fails the
      # gate, except on a fork PR, which gets no secrets and says so here.
      - run: npm test
        env:
          DOCS_OPSEC_DENYLIST: ${{ secrets.DOCS_OPSEC_DENYLIST }}
          DOCS_OPSEC_DENYLIST_OPTIONAL: ${{ github.event.pull_request.head.repo.fork && '1' || '' }}

  # The static demo export (studio.dragonhound.dev) must not scroll sideways on
  # a phone: every route at 390 px, light and dark, plus no console errors or
  # CSP violations, and the shared theme script (dh-theme.js) must run, toggle and
  # apply a saved choice before first paint. Playwright is installed here only;
  # the app doesn't depend on it.
  static-overflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build:static

      # Retried: --with-deps installs fonts through apt, and an Ubuntu mirror outage
      # failed the 2026-11-19 nightly before any check ran (#241).
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.65.0
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::Chromium install failed (attempt $attempt of 3)"
            sleep $((attempt * 30))
          done
          exit 1

      - run: node scripts/check-overflow.mjs out --width=390

  # Property-based UI testing (Bombadil, argus-studio#240/#241), now argus-ci's reusable
  # bombadil.yml (argus-ci#12): where static-overflow loads each route once, this drives a
  # browser around the static export at random for 3 minutes, with clicks, typing, scrolling,
  # back/reload and resizes, and checks frontend/bombadil/spec.ts in every state. On a violation
  # it uploads the trace and writes the replay commands to the job summary.
  # Not required yet: continue-on-error stays until about two weeks of runs without a spurious
  # failure.
  bombadil:
    uses: smk762/argus-ci/.github/workflows/bombadil.yml@v1
    with:
      working-directory: frontend
      # Same Node as the image's base (frontend/Dockerfile) and the other jobs here.
      node-version: "22.23.4"
      build-command: npm run build:static
      serve-dir: out
      specification: bombadil/spec.ts
      time-limit: 3m
      # Matches the devDependency that types the spec.
      bombadil-version: 0.7.10
      continue-on-error: true

  # The Dragonhound shared design layer (frontend/vendor/dh) is vendored from
  # dragonhound-site/shared and must not be edited here. Fails if a vendored file
  # changed locally or no longer matches the published v1 manifest; a newer
  # upstream version is only a warning (re-sync in its own PR).
  dh-shared:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - run: node frontend/vendor/dh/sync-shared.mjs --check . --against https://dragonhound.dev/brand/v1/manifest.json --allow-outdated

  suite-rules:
    # argus-ci suite rules: lint rules that each eliminate a finding class. New violations fail;
    # existing ones are in .suite-rules-baseline.json, which may only shrink.
    uses: smk762/argus-ci/.github/workflows/suite-rules.yml@v1
