name: Release image to GHCR

# Publishes the frontend container to ghcr.io/<owner>/argus-studio on every
# v* tag, for the argus-halo demo to `docker pull` without auth (once the GHCR
# package is set to public — a one-time step after the first release).
#
# The image takes NO build-time configuration (argus-studio#56). Endpoints and
# the curator UI mode are read from the container's environment on each request,
# so one published image deploys to any origin — configure it per DEPLOYMENT with
# `ARGUS_*` env vars (see README "Environment"), not with repository variables.
#
# Unset means demo mode against localhost:810x, i.e. the browser expects the
# argus compose stack on the user's own host (only /curate demo mode is
# backend-free). The `vars.NEXT_PUBLIC_*` repository variables this workflow used
# to pass as build-args no longer do anything and can be deleted.

on:
  push:
    # Require a digit after `v` so a stray tag (vtest, v-wip) can't publish.
    tags: ["v[0-9]*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; each job asks for what it needs.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/argus-studio

jobs:
  # Each architecture builds natively on its own runner and pushes by digest
  # only (no tag yet); `publish-image` then joins the two digests into one
  # tagged manifest list. Docker's "distribute build across multiple runners"
  # pattern: https://docs.docker.com/build/ci/github-actions/multi-platform/
  #
  # arm64 used to build under QEMU on an amd64 runner. For v0.4.0 the emulated
  # `npm ci` died with `qemu: uncaught target signal 4 (Illegal instruction)`
  # and then hung until the job timeout, so nothing was published. Native arm64
  # runners (`ubuntu-24.04-arm`, free for public repositories) take QEMU out of
  # the picture and build in about the same time as amd64.
  build-image:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # A native build takes a few minutes. These limits make a hang fail fast
    # instead of holding the release for half an hour.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the labels are used here; the tags are applied in publish-image.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v6
        timeout-minutes: 15
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          # Single manifest per platform — skip the default provenance
          # attestation that otherwise adds an `unknown/unknown` entry to GHCR.
          provenance: false
          # One cache per architecture, so the two builds don't evict each
          # other's layers.
          cache-from: type=gha,scope=release-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=release-${{ env.PLATFORM_PAIR }}
          # No build-args: the image takes no build-time configuration at all.

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-image:
    # Tags the two per-architecture digests as one multi-platform image. Nothing
    # is tagged unless both architectures built.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build-image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `latest` comes from the default `flavor: latest=auto`, which tags it
          # only on the newest non-pre-release semver — so an rc/beta tag does
          # not move `latest`. (An explicit type=raw,value=latest would.)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create the manifest list and push the tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          count=$(find . -maxdepth 1 -type f | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 platform digests, found ${count}"
            exit 1
          fi
          mapfile -t tag_args < <(jq -r '.tags[] | "--tag", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=()
          for digest in *; do
            refs+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"

      - name: Inspect the image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  github-release:
    # The GitHub Release is the last step, so it only appears once the image is
    # actually on GHCR. Its notes are this version's CHANGELOG.md section, with
    # the image to pull appended. Studio builds no wheel or other file, so the
    # Release carries no assets. Ported from argus-lens#67.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish-image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG.md
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/argus-studio
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [${version}]" 'index($0, head) == 1 {found = 1; next} found && /^## \[/ {exit} found' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi
          # Drop the link-reference definitions at the foot of the last section.
          sed -i '/^\[[^]]*\]: /d' notes.md
          {
            echo
            echo "### Image"
            echo
            echo '```sh'
            echo "docker pull ${IMAGE}:${version}"
            echo '```'
          } >> notes.md
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease=""
          case "$tag" in *-*|*rc*|*a[0-9]*|*b[0-9]*) prerelease="--prerelease" ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-run of the workflow: refresh the notes rather than failing.
            gh release edit "$tag" --notes-file notes.md $prerelease
          else
            gh release create "$tag" --verify-tag --title "$tag" --notes-file notes.md $prerelease
          fi
