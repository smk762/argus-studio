name: Release image to GHCR

# Publishes the frontend container to ghcr.io/<owner>/argus-studio on every
# v* tag, for the argus-halo demo to `docker pull` without auth (once the GHCR
# package is set to public — a one-time step after the first release).
#
# NEXT_PUBLIC_* are inlined into the client bundle at BUILD time, so the image
# is baked for one runtime. Defaults below produce a demo-mode image; override
# any of them per deployment by setting a repository variable of the same name
# (Settings → Secrets and variables → Actions → Variables). They are public
# config by nature — never secrets.

on:
  push:
    # Require a digit after `v` so a stray tag (vtest, v-wip) can't publish.
    tags: ["v[0-9]*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # QEMU is needed to build the linux/arm64 image on an amd64 runner.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/argus-studio
          # `latest` comes from the default `flavor: latest=auto`, which tags it
          # only on the newest non-pre-release semver — so an rc/beta tag does
          # not move `latest`. (An explicit type=raw,value=latest would.)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Single manifest per platform — skip the default provenance
          # attestation that otherwise adds an `unknown/unknown` entry to GHCR.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Baked into the client bundle. Unset variables fall back to the
          # demo-mode defaults (which match the Dockerfile). This is a demo
          # FRONT-END: with default localhost:810x URLs the browser expects the
          # argus compose stack on the user's own host (only /curate demo mode
          # is backend-free). Override the vars for a hosted deployment.
          build-args: |
            NEXT_PUBLIC_CURATOR_UI_MODE=${{ vars.NEXT_PUBLIC_CURATOR_UI_MODE || 'demo' }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8100' }}
            NEXT_PUBLIC_CURATOR_URL=${{ vars.NEXT_PUBLIC_CURATOR_URL || 'http://localhost:8101' }}
            NEXT_PUBLIC_QUARRY_URL=${{ vars.NEXT_PUBLIC_QUARRY_URL || 'http://localhost:8102' }}
            NEXT_PUBLIC_FORGE_URL=${{ vars.NEXT_PUBLIC_FORGE_URL || 'http://localhost:8103' }}
            NEXT_PUBLIC_PROOF_URL=${{ vars.NEXT_PUBLIC_PROOF_URL || 'http://localhost:8104' }}
            NEXT_PUBLIC_LENS_INTERNAL_URL=${{ vars.NEXT_PUBLIC_LENS_INTERNAL_URL }}
            NEXT_PUBLIC_CURATOR_SOURCE_PATH=${{ vars.NEXT_PUBLIC_CURATOR_SOURCE_PATH }}
            NEXT_PUBLIC_CURATOR_OUTPUT_PATH=${{ vars.NEXT_PUBLIC_CURATOR_OUTPUT_PATH }}
