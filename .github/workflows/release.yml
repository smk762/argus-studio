name: Release image to GHCR

# Publishes the frontend container to ghcr.io/<owner>/argus-studio on every
# v* tag, for the argus-halo demo to `docker pull` without auth (once the GHCR
# package is set to public — a one-time step after the first release).
#
# The image takes NO build-time configuration (argus-studio#56). Endpoints and
# the curator UI mode are read from the container's environment on each request,
# so one published image deploys to any origin — configure it per DEPLOYMENT with
# `ARGUS_*` env vars (see README "Environment"), not with repository variables.
#
# Unset means demo mode against localhost:810x, i.e. the browser expects the
# argus compose stack on the user's own host (only /curate demo mode is
# backend-free). The `vars.NEXT_PUBLIC_*` repository variables this workflow used
# to pass as build-args no longer do anything and can be deleted.

on:
  push:
    # Require a digit after `v` so a stray tag (vtest, v-wip) can't publish.
    tags: ["v[0-9]*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; each job asks for what it needs.
permissions:
  contents: read

jobs:
  publish-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # QEMU is needed to build the linux/arm64 image on an amd64 runner.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/argus-studio
          # `latest` comes from the default `flavor: latest=auto`, which tags it
          # only on the newest non-pre-release semver — so an rc/beta tag does
          # not move `latest`. (An explicit type=raw,value=latest would.)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Single manifest per platform — skip the default provenance
          # attestation that otherwise adds an `unknown/unknown` entry to GHCR.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # No build-args: the image takes no build-time configuration at all.

  github-release:
    # The GitHub Release is the last step, so it only appears once the image is
    # actually on GHCR. Its notes are this version's CHANGELOG.md section, with
    # the image to pull appended. Studio builds no wheel or other file, so the
    # Release carries no assets. Ported from argus-lens#67.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish-image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG.md
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/argus-studio
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [${version}]" 'index($0, head) == 1 {found = 1; next} found && /^## \[/ {exit} found' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi
          # Drop the link-reference definitions at the foot of the last section.
          sed -i '/^\[[^]]*\]: /d' notes.md
          {
            echo
            echo "### Image"
            echo
            echo '```sh'
            echo "docker pull ${IMAGE}:${version}"
            echo '```'
          } >> notes.md
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease=""
          case "$tag" in *-*|*rc*|*a[0-9]*|*b[0-9]*) prerelease="--prerelease" ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-run of the workflow: refresh the notes rather than failing.
            gh release edit "$tag" --notes-file notes.md $prerelease
          else
            gh release create "$tag" --verify-tag --title "$tag" --notes-file notes.md $prerelease
          fi
