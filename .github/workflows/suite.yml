name: Suite

# argus-ci's suite-check: fails if CLAUDE.md loses the argus-suite block or this
# repo's row goes missing from argus-cortex's SUITE.md; on a release tag it also
# prints a reminder to confirm that row is current.

on:
  push:
    branches: [dev, main]
    tags: ["v[0-9]*"]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  suite:
    uses: smk762/argus-ci/.github/workflows/suite-check.yml@v1
