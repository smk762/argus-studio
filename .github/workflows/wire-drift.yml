name: Wire schema drift

# Daily: has any package's `dev` branch moved past the commit
# frontend/schema/pins.json records for it? Studio follows each package's dev
# HEAD, not a release (argus-studio#170). If so, re-pull every wire schema at
# its current dev HEAD (`npm run wire:pull`), run the checks CI would
# (wire:check, lint, typecheck, tests), and open or update one PR from
# `chore/wire-sync` into dev. If they fail, the schema changed in a way Studio's
# code must follow: open or update one issue instead, naming the run.
#
# A PR opened with GITHUB_TOKEN does not trigger other workflows, so ci.yml will
# not run on it by itself: close and reopen it, or push to the branch, to run it.
# The handbook's docs-drift job (smk762/argus-handbook) does the same for docs.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: wire-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: chore/wire-sync
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - id: compare
        run: |
          moved=""
          for name in $(jq -r 'keys_unsorted[]' schema/pins.json); do
            repo=$(jq -r ".[\"$name\"].repo" schema/pins.json)
            branch=$(jq -r ".[\"$name\"].branch" schema/pins.json)
            recorded=$(jq -r ".[\"$name\"].commit" schema/pins.json)
            head=$(git ls-remote "https://github.com/$repo" "refs/heads/$branch" | cut -f1)
            if [ -n "$head" ] && [ "$head" != "$recorded" ]; then
              echo "$name: ${recorded:0:9} -> ${head:0:9}"
              moved="$moved $name"
            fi
          done
          echo "moved=${moved# }" >> "$GITHUB_OUTPUT"
          [ -n "$moved" ] || echo "Every pinned package's dev is still at its recorded commit."

      - if: steps.compare.outputs.moved != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - if: steps.compare.outputs.moved != ''
        run: npm ci

      - id: pull
        if: steps.compare.outputs.moved != ''
        env:
          MOVED: ${{ steps.compare.outputs.moved }}
        run: npm run wire:pull -- $MOVED

      - id: check
        if: steps.compare.outputs.moved != ''
        continue-on-error: true
        env:
          DOCS_OPSEC_DENYLIST: ${{ secrets.DOCS_OPSEC_DENYLIST }}
        run: |
          npm run wire:check
          npm run lint
          npm run typecheck
          npm test

      - id: pr
        if: steps.compare.outputs.moved != '' && steps.check.outcome == 'success'
        env:
          MOVED: ${{ steps.compare.outputs.moved }}
        run: |
          summary=$(jq -r 'to_entries[] | "- \(.value.repo) \(.value.version) @ \(.value.commit[0:7])"' schema/pins.json)
          changed=$(git diff --name-only -- schema/*.schema.json schema/taxonomy-schema.json | xargs -r -n1 basename | tr '\n' ' ')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add schema src/lib/generated
          git commit -m "chore(wire): sync wire schemas to dev HEAD ($MOVED)"
          git push --force origin "$BRANCH"
          body="Re-pulls the wire schemas at each package's current \`dev\` HEAD (moved: $MOVED). Schema files changed: ${changed:-none, only the recorded commit and version}. wire:check, lint, typecheck and the tests passed in the drift job.

          $summary

          If a package's recorded demo data (public/demo, public/curator-sample, lib/*Sample.ts) was made at an older version, it is still labelled with that version; re-record it when the change touches what it shows.

          Opened with GITHUB_TOKEN, so CI does not run on it by itself: close and reopen this PR (or push to \`$BRANCH\`) to run it."
          number=$(gh pr list --head "$BRANCH" --base dev --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/pulls/$number" -f body="$body" >/dev/null
            echo "Updated #$number."
          else
            gh pr create --base dev --head "$BRANCH" --title "chore(wire): sync wire schemas to dev HEAD" --body "$body"
          fi

      - if: steps.compare.outputs.moved != '' && steps.check.outcome == 'failure'
        env:
          MOVED: ${{ steps.compare.outputs.moved }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Wire schema sync blocked"
          body="Pulling the wire schemas at \`dev\` HEAD (moved: $MOVED) breaks wire:check, lint, typecheck or the tests: Studio's code has to follow a schema change. Run: $RUN

          Reproduce with \`npm run wire:pull -- $MOVED\` in frontend/, then fix what typecheck reports."
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
