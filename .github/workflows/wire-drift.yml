name: Wire schema drift

# Daily: has any package's `dev` branch moved past the commit
# frontend/schema/pins.json records for it? Studio follows each package's dev
# HEAD, not a release (argus-studio#170). If so, re-pull every wire schema at
# its current dev HEAD (`npm run wire:pull`), run the checks CI would
# (wire:check, lint, typecheck, tests), and open or update one PR from
# `chore/wire-sync` into dev. If they fail, the schema changed in a way Studio's
# code must follow: open or update one issue instead, naming the run.
#
# A PR opened with GITHUB_TOKEN does not trigger other workflows, so ci.yml will
# not run on it by itself: close and reopen it, or push to the branch, to run it.
# The handbook's docs-drift job (smk762/argus-handbook) does the same for docs.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: wire-drift
  cancel-in-progress: false

jobs:
  # Recorded demo samples (schema/demo.json) behind their package's dev HEAD.
  # Re-recording needs a GPU host, so this only opens or updates one issue.
  recordings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - run: |
          behind=""
          for name in $(jq -r 'keys_unsorted[]' frontend/schema/demo.json); do
            repo=$(jq -r ".[\"$name\"].repo" frontend/schema/demo.json)
            branch=$(jq -r ".[\"$name\"].branch" frontend/schema/demo.json)
            recorded=$(jq -r ".[\"$name\"].commit" frontend/schema/demo.json)
            version=$(jq -r ".[\"$name\"].version" frontend/schema/demo.json)
            head=$(git ls-remote "https://github.com/$repo" "refs/heads/$branch" | cut -f1)
            if [ -n "$head" ] && [ "$head" != "$recorded" ]; then
              behind="$behind
          - $repo: recorded at $version (\`${recorded:0:7}\`), dev is now \`${head:0:7}\` ([diff](https://github.com/$repo/compare/$recorded...$head))"
            fi
          done
          title="Demo recordings behind dev"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -z "$behind" ]; then
            echo "Every recording is at its package's dev HEAD."
            exit 0
          fi
          body="These recorded demo samples were made by an older \`dev\` commit than their package's current one:
          $behind

          Re-record a sample when the diff changes what it shows (the recipes are in scripts/ and each sample's provenance), then update frontend/schema/demo.json. A curator recording moves with its wire pin (schema/pins.json) in one PR."
          if [ -n "$number" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/$number" -f body="$body" >/dev/null
            echo "Updated #$number."
          else
            gh issue create --title "$title" --body "$body"
          fi

  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: chore/wire-sync
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - id: compare
        run: |
          moved=""
          for name in $(jq -r 'keys_unsorted[]' schema/pins.json); do
            repo=$(jq -r ".[\"$name\"].repo" schema/pins.json)
            branch=$(jq -r ".[\"$name\"].branch" schema/pins.json)
            recorded=$(jq -r ".[\"$name\"].commit" schema/pins.json)
            head=$(git ls-remote "https://github.com/$repo" "refs/heads/$branch" | cut -f1)
            if [ -n "$head" ] && [ "$head" != "$recorded" ]; then
              # A package with a recorded demo sample (schema/demo.json) keeps its pin on the
              # recorded commit until its schema itself changes: the two move together, and
              # re-recording needs a GPU host (the recordings job tracks that lag).
              if jq -e --arg n "$name" 'has($n)' schema/demo.json >/dev/null; then
                path=$(jq -r ".[\"$name\"].path // \"schema/$name-wire.schema.json\"" schema/pins.json)
                pinned=$(jq -r ".[\"$name\"].sha256" schema/pins.json)
                now=$(curl -sfL "https://raw.githubusercontent.com/$repo/$head/$path" | sha256sum | cut -d' ' -f1)
                if [ "$now" = "$pinned" ]; then
                  echo "$name: dev moved to ${head:0:9}, schema unchanged; the pin stays with its recording"
                  continue
                fi
              fi
              echo "$name: ${recorded:0:9} -> ${head:0:9}"
              moved="$moved $name"
            fi
          done
          echo "moved=${moved# }" >> "$GITHUB_OUTPUT"
          [ -n "$moved" ] || echo "Every pinned package's dev is still at its recorded commit."

      - if: steps.compare.outputs.moved != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - if: steps.compare.outputs.moved != ''
        run: npm ci

      - id: pull
        if: steps.compare.outputs.moved != ''
        env:
          MOVED: ${{ steps.compare.outputs.moved }}
        run: npm run wire:pull -- $MOVED

      - id: check
        if: steps.compare.outputs.moved != ''
        continue-on-error: true
        env:
          DOCS_OPSEC_DENYLIST: ${{ secrets.DOCS_OPSEC_DENYLIST }}
        run: |
          npm run wire:check
          npm run lint
          npm run typecheck
          npm test

      - id: pr
        if: steps.compare.outputs.moved != '' && steps.check.outcome == 'success'
        env:
          MOVED: ${{ steps.compare.outputs.moved }}
        run: |
          summary=$(jq -r 'to_entries[] | "- \(.value.repo) \(.value.version) @ \(.value.commit[0:7])"' schema/pins.json)
          changed=$(git diff --name-only -- schema/*.schema.json schema/taxonomy-schema.json | xargs -r -n1 basename | tr '\n' ' ')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add schema src/lib/generated
          git commit -m "chore(wire): sync wire schemas to dev HEAD ($MOVED)"
          git push --force origin "$BRANCH"
          body="Re-pulls the wire schemas at each package's current \`dev\` HEAD (moved: $MOVED). Schema files changed: ${changed:-none, only the recorded commit and version}. wire:check, lint, typecheck and the tests passed in the drift job.

          $summary

          If a package's recorded demo data (public/demo, public/curator-sample, lib/*Sample.ts) was made at an older version, it is still labelled with that version; re-record it when the change touches what it shows.

          Opened with GITHUB_TOKEN, so CI does not run on it by itself: close and reopen this PR (or push to \`$BRANCH\`) to run it."
          number=$(gh pr list --head "$BRANCH" --base dev --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/pulls/$number" -f body="$body" >/dev/null
            echo "Updated #$number."
          else
            gh pr create --base dev --head "$BRANCH" --title "chore(wire): sync wire schemas to dev HEAD" --body "$body"
          fi

      - if: steps.compare.outputs.moved != '' && steps.check.outcome == 'failure'
        env:
          MOVED: ${{ steps.compare.outputs.moved }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Wire schema sync blocked"
          body="Pulling the wire schemas at \`dev\` HEAD (moved: $MOVED) breaks wire:check, lint, typecheck or the tests. Run: $RUN

          - If typecheck or a wire test fails, Studio's code has to follow a schema change: reproduce with \`npm run wire:pull -- $MOVED\` in frontend/ and fix what it reports.
          - If only \`src/lib/demoRecordings.test.ts\` fails, the package's recorded demo sample must move with its pin (schema/demo.json): re-record it at the new commit (needs the GPU; see public/curator-sample/PROVENANCE.md and scripts/record_curator_demo.py), then pull the pin in the same PR."
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
