# Argus suite — one stack, loosely coupled.
#
# By DEFAULT the backends run from their published GHCR images, so no sibling
# repos need to be checked out. The services are independent; pick what you need
# with profiles:
#
#   docker compose up                        # frontend only (demo mode, no backend)
#   docker compose --profile curator up      # frontend + argus-curator
#   docker compose --profile lens    up      # frontend + argus-lens
#   docker compose --profile gallery up      # run argus-quarry: acquire -> DATASET_DIR
#   docker compose --profile forge   up      # frontend + curator + argus-forge
#                                            # (training configs; needs
#                                            #  ARGUS_CURATOR_UI_MODE=live)
#   docker compose --profile proof   up      # frontend + argus-proof
#                                            # (post-training LoRA evaluation)
#   docker compose --profile atlas   up      # frontend + argus-atlas
#   docker compose --profile darkroom up     # frontend + argus-darkroom (not in full)
#                                            # (georeferenced fantasy-map bakes)
#   docker compose --profile full    up      # whole suite (pulls any MISSING images, then runs)
#   docker compose --profile full    pull    # refresh images to the current *_TAG
#                                            # (`up` will NOT re-pull a tag already cached locally)
#
# Pin a specific released version with the *_TAG vars in .env (default `latest`,
# except LENS_TAG and ATLAS_TAG, which default to a pinned release; see .env.example):
#   CURATOR_TAG / LENS_TAG / QUARRY_TAG / FORGE_TAG / PROOF_TAG / ATLAS_TAG /
#   DARKROOM_TAG.
# (Only `frontend` is always built locally from ./frontend — it is this repo,
# argus-studio, and has no published image yet.)
#
# BUILD FROM LOCAL SOURCE (sibling repos checked out) — layer the override that
# re-adds each backend's `build:` context. Requires ../argus-{curator,lens,...}:
#   docker compose -f compose.yaml -f compose.build.yaml --profile full up --build
#
# NVIDIA GPUs (optional): add the override file — layers on either path, e.g.
#   docker compose -f compose.yaml -f compose.gpu.yaml --profile full up
#
# argus-quarry (gallery profile) is the upstream *producer*: a run-to-completion
# job that acquires PD/CC0 images into its own pool — grouped into LoRA-training
# categories (identity / wardrobe / setting / concept) since quarry 0.2 — and
# publishes a curator-ready <category>/<subject>/ tree into DATASET_DIR.
# curator/lens then consume that view:
#   docker compose --profile gallery up     # fetch -> pool -> publish DATASET_DIR
#   docker compose --profile curator up     # then curate the published images
#
# Cross-service coupling is limited to shared volumes: argus-curator and
# argus-lens share the dataset at /data/images (lens reads the manifest's
# abs_path entries and writes .txt sidecars), and argus-forge shares the same
# dataset (ro, to collect those sidecars) plus the export dir /data/out with
# the curator. Each service still runs fine on its own.
name: argus-suite

services:
  frontend:
    # The one always-local build (argus-studio has no published image yet). `up`
    # builds it on first run but does NOT rebuild on source change — re-run with
    # `up --build` (or `docker compose build frontend`) after editing ./frontend
    # or pulling new code, otherwise the previously built image is reused.
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    # Read at request time, so `docker compose up -d frontend` picks up .env
    # changes without a rebuild. The NEXT_PUBLIC_* fallbacks keep pre-#56 .env
    # files working.
    #
    # `${VAR-default}` (no colon) is deliberate: the `:-` form would replace an
    # explicitly EMPTY value with the default, and empty is meaningful here — it
    # means "call this API on the page's own origin", which is what argus-halo
    # wants behind Caddy. Only an *unset* variable takes the default.
    environment:
      - ARGUS_LENS_URL=${ARGUS_LENS_URL-${NEXT_PUBLIC_API_URL-http://localhost:8100}}
      - ARGUS_CURATOR_URL=${ARGUS_CURATOR_URL-${NEXT_PUBLIC_CURATOR_URL-http://localhost:8101}}
      - ARGUS_QUARRY_URL=${ARGUS_QUARRY_URL-${NEXT_PUBLIC_QUARRY_URL-http://localhost:8102}}
      - ARGUS_FORGE_URL=${ARGUS_FORGE_URL-${NEXT_PUBLIC_FORGE_URL-http://localhost:8103}}
      - ARGUS_PROOF_URL=${ARGUS_PROOF_URL-${NEXT_PUBLIC_PROOF_URL-http://localhost:8104}}
      - ARGUS_ATLAS_URL=${ARGUS_ATLAS_URL-${NEXT_PUBLIC_ATLAS_URL-http://localhost:8105}}
      - ARGUS_DARKROOM_URL=${ARGUS_DARKROOM_URL-http://localhost:8106}
      - ARGUS_LIGHTBOX_URL=${ARGUS_LIGHTBOX_URL-}
      - ARGUS_CULL_URL=${ARGUS_CULL_URL-}
      - ARGUS_SAFELIGHT_URL=${ARGUS_SAFELIGHT_URL-}
      # Footer link to argus-sightline. The `survey` profile runs it on :3107; set this to show the link.
      - ARGUS_SIGHTLINE_URL=${ARGUS_SIGHTLINE_URL-}
      - ARGUS_CURATOR_UI_MODE=${ARGUS_CURATOR_UI_MODE-${NEXT_PUBLIC_CURATOR_UI_MODE-demo}}
      - ARGUS_CURATOR_SOURCE_PATH=${ARGUS_CURATOR_SOURCE_PATH-${NEXT_PUBLIC_CURATOR_SOURCE_PATH-/data/images}}
      - ARGUS_CURATOR_OUTPUT_PATH=${ARGUS_CURATOR_OUTPUT_PATH-${NEXT_PUBLIC_CURATOR_OUTPUT_PATH-/data/out}}
      - ARGUS_DEVMODE=${ARGUS_DEVMODE-${DEVMODE:-}}
    restart: unless-stopped

  argus-lens:
    profiles: ["lens", "full"]
    # Default: pull the published standalone image (baked EXTRAS=server,local).
    # For a source build (or a different LENS_EXTRAS) add compose.build.yaml.
    image: ghcr.io/smk762/argus-lens:${LENS_TAG:-0.10.0}
    ports:
      - "${LENS_PORT:-8100}:8100"
    environment:
      - ARGUS_BACKEND=${ARGUS_BACKEND:-hybrid}
      - ARGUS_API_KEY=${ARGUS_API_KEY:-}
      # Browser origins allowed to call lens. Ignored by lens 0.10 (its --cors
      # allows any origin); from the next lens release an empty value means
      # localhost:3000 only, and cross-site writes from other origins get 403.
      - LENS_CORS_ORIGINS=${LENS_CORS_ORIGINS:-}
      # Optional Immich integration (caption page "Immich" mode + pull-to-dataset).
      # Leave unset to disable; lens's /immich/* endpoints then return 503.
      - IMMICH_URL=${IMMICH_URL:-}
      - IMMICH_API_KEY=${IMMICH_API_KEY:-}
      # Root the caption page's folder picker browses (GET /folders).
      - LENS_SOURCE_PATH=/data/images
      - HF_HOME=/root/.cache/huggingface
      - HF_TRUST_REMOTE_CODE=${HF_TRUST_REMOTE_CODE:-false}
      # Prose from an OpenAI-compatible server (Ollama, vLLM, LM Studio), used by
      # ARGUS_BACKEND=openai-compat or hybrid:wd14+openai-compat. The URL is
      # reached FROM THE CONTAINER: a LAN host by IP, or this compose host as
      # http://host.docker.internal:11434/v1 (see extra_hosts below).
      - ARGUS_OPENAI_COMPAT_BASE_URL=${ARGUS_OPENAI_COMPAT_BASE_URL:-}
      - ARGUS_OPENAI_COMPAT_MODEL=${ARGUS_OPENAI_COMPAT_MODEL:-}
      - ARGUS_OPENAI_COMPAT_API_KEY=${ARGUS_OPENAI_COMPAT_API_KEY:-}
      - ARGUS_OPENAI_COMPAT_PROMPT=${ARGUS_OPENAI_COMPAT_PROMPT:-}
      # Which WD v3 tagger to use (default SmilingWolf/wd-vit-tagger-v3). A
      # non-default repo downloads into its own subdir of the WD14 cache below.
      - WD14_MODEL_REPO=${WD14_MODEL_REPO:-}
      # LLM rewrite of assembled captions; a rewrite is kept only if it passes
      # lens's post-check. On by default against the ollama service below;
      # ARGUS_REFINE=off disables it. Unreachable endpoint = deterministic captions.
      - ARGUS_REFINE=${ARGUS_REFINE:-}
      - ARGUS_REFINE_MODEL=${ARGUS_REFINE_MODEL:-}
      - ARGUS_REFINE_BASE_URL=${ARGUS_REFINE_BASE_URL:-http://ollama:11434/v1}
      - ARGUS_REFINE_API_KEY=${ARGUS_REFINE_API_KEY:-}
      - ARGUS_REFINE_VARIANTS=${ARGUS_REFINE_VARIANTS:-}
      # Sharing the GPU with ComfyUI: free lens's VRAM after N idle seconds.
      # (ARGUS_GPU_COORDINATOR=lease only serialises argus jobs; ComfyUI does
      # not take the lease.)
      - ARGUS_IDLE_UNLOAD_S=${ARGUS_IDLE_UNLOAD_S:-}
      - ARGUS_GPU_COORDINATOR=${ARGUS_GPU_COORDINATOR:-none}
      # Used by the lease coordinator, which compose.gpu.yaml turns on. Lens and
      # curator must name the same lock file, in the same host directory below.
      - ARGUS_GPU_LEASE_PATH=/run/argus-gpu/argus-gpu.lock
      - ARGUS_GPU_LEASE_TIMEOUT_S=${ARGUS_GPU_LEASE_TIMEOUT_S:-300}
    volumes:
      - ${ARGUS_GPU_LOCK_DIR:-/tmp/argus-gpu}:/run/argus-gpu
      # Shared dataset (RW so lens can write caption sidecars next to source images).
      - ${DATASET_DIR:-./data}:/data/images
      # Curator's export root. A move-mode export deletes the sources, so the
      # handoff manifest points at the transferred files under here — without
      # this mount lens cannot open a single row of a move export. RW so the
      # .txt sidecars land next to the exported images.
      - ${OUTPUT_DIR:-./out}:/data/out
      # Resolve argus-quarry's published symlinks (they point into the raw pool).
      # Harmless if the gallery profile isn't used; required when it is (unless
      # quarry published with --copy).
      - ${QUARRY_HOME:-./quarry}:/data/quarry:ro
      - ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
      # WD14 tagger weights. RW so a new WD14_MODEL_REPO can download into it.
      - ${WD14_CACHE_DIR:-${HOME}/.cache/wd14_tagger}:/root/.cache/wd14_tagger
      # RAM++ photo-tagger checkpoint (~3 GB, downloaded on first use by
      # ARGUS_BACKEND=ram / hybrid:ram+...). Mounted so it survives recreation.
      - ${RAM_CACHE_DIR:-${HOME}/.cache/ram_plus}:/root/.cache/ram_plus
    extra_hosts:
      # Reach an Ollama (or other OpenAI-compatible server) on the compose host.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # LLM for lens's caption refinement. Internal only (no published port): lens
  # reaches it as http://ollama:11434/v1. ~6 GB VRAM for qwen3:8b while loaded.
  ollama:
    profiles: ["lens", "full"]
    image: ollama/ollama:${OLLAMA_TAG:-0.40.11}
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  # One-shot: pull the refine model into the ollama volume (a no-op once
  # present). Retries until the ollama server is up.
  ollama-pull:
    profiles: ["lens", "full"]
    image: ollama/ollama:${OLLAMA_TAG:-0.40.11}
    environment:
      - OLLAMA_HOST=ollama:11434
    command: ["pull", "${ARGUS_REFINE_MODEL:-qwen3:8b}"]
    depends_on:
      - ollama
    restart: on-failure

  argus-curator:
    # Also in the forge profile: /forge trains on a curator export, and the
    # export flow hands off to it. /forge itself works without the curator —
    # point it at any export dir under the shared root.
    profiles: ["curator", "forge", "full"]
    image: ghcr.io/smk762/argus-curator:${CURATOR_TAG:-latest}
    ports:
      - "${CURATOR_PORT:-8101}:8101"
    environment:
      - CURATOR_SOURCE_PATH=/data/images
      # Required for live-mode export: the server refuses /export outright when
      # the export root is unset. Matches the /data/out mount below, so the
      # ExportPanel's default dest resolves as the (root-equal) export root.
      - CURATOR_EXPORT_PATH=/data/out
      - CURATOR_CACHE_DIR=/root/.cache/argus_curator/scans
      - HF_HOME=/root/.cache/huggingface
      # The image's default --cors permits only http://localhost:3000, which is
      # reproduced here as the fallback. Browsing from another machine? Add that
      # browser origin in .env, comma-separated, e.g.
      #   CURATOR_CORS_ORIGINS=http://localhost:3000,http://192.168.1.39:3000
      # (The argus-halo demo is same-origin behind Caddy and never needs this.)
      - CURATOR_CORS_ORIGINS=${CURATOR_CORS_ORIGINS:-http://localhost:3000}
      # Destructive mode="move" is rejected unless enabled here. Left off so the
      # demo can't relocate source images; the ExportPanel disables the option
      # to match. Uncomment to permit it.
      # - CURATOR_ALLOW_MOVE=1
      # POST /scan/{id}/delete removes source files. Without this it takes only
      # frames curator reads as under 18 with exposure. Uncomment to let /curate
      # delete any selected image.
      # - CURATOR_ALLOW_DELETE=1
      # DEVMODE=1 allows the same delete. Set CURATOR_DEVMODE=0 to keep dev mode
      # in the UI without it.
      - CURATOR_DEVMODE=${CURATOR_DEVMODE-${ARGUS_DEVMODE-${DEVMODE:-}}}
      # Detector models, under the cache mount below. A file that isn't there
      # leaves that detector reported as unavailable. Build them with
      # `argus-curator fairface-convert`, `mivolo-convert`, `places365-convert`
      # and `garments-convert`.
      - ARGUS_CURATOR_FAIRFACE_MODEL=/root/.cache/argus_curator/models/fairface_res34_race7.onnx
      - ARGUS_CURATOR_MIVOLO_MODEL=/root/.cache/argus_curator/models/mivolo_v2_d1_384.onnx
      - ARGUS_CURATOR_PLACES365_MODEL=/root/.cache/argus_curator/models/places365_resnet18.onnx
      - ARGUS_CURATOR_GARMENTS_MODEL=/root/.cache/argus_curator/models/yolos_fashionpedia.onnx
      # NudeNet nudity check, on by default. Unset: the nudenet service below.
      # Point it elsewhere in .env, or set it empty to switch it off.
      - ARGUS_CURATOR_NUDENET_URL=${ARGUS_CURATOR_NUDENET_URL-http://nudenet:8080}
      - ARGUS_CURATOR_NUDENET_TIMEOUT=${ARGUS_CURATOR_NUDENET_TIMEOUT:-}
      - ARGUS_CURATOR_NUDENET_WORKERS=${ARGUS_CURATOR_NUDENET_WORKERS:-}
      # EraX second detector, off unless .env sets a URL (no published image).
      - ARGUS_CURATOR_ERAX_URL=${ARGUS_CURATOR_ERAX_URL-}
      # Watermark detector for crops, off unless .env sets a URL (no server is
      # bundled). A scan asking for it gets a 503 while the detector is down.
      - ARGUS_CURATOR_WATERMARK_URL=${ARGUS_CURATOR_WATERMARK_URL-}
      # SingGuard policy check, off unless .env sets a URL (no server is bundled:
      # it runs a vision language model).
      - ARGUS_CURATOR_SINGGUARD_URL=${ARGUS_CURATOR_SINGGUARD_URL-}
      # cascade: fast on every frame, slow only on what fast flags.
      - ARGUS_CURATOR_SINGGUARD_THINKING=${ARGUS_CURATOR_SINGGUARD_THINKING-cascade}
      # What the scan already knows, sent as context. Empty sends the image alone.
      - ARGUS_CURATOR_SINGGUARD_CONTEXT=${ARGUS_CURATOR_SINGGUARD_CONTEXT-age,folder,caption,scene}
      - ARGUS_CURATOR_SINGGUARD_POLICY_FILE=${ARGUS_CURATOR_SINGGUARD_POLICY_FILE:-}
      # One argus GPU job at a time, shared with lens: see the lens service.
      # compose.gpu.yaml turns the lease on. A CPU image never takes it.
      - ARGUS_GPU_COORDINATOR=${ARGUS_GPU_COORDINATOR:-none}
      - ARGUS_GPU_LEASE_PATH=/run/argus-gpu/argus-gpu.lock
      - ARGUS_GPU_LEASE_TIMEOUT_S=${ARGUS_GPU_LEASE_TIMEOUT_S:-300}
    volumes:
      - ${ARGUS_GPU_LOCK_DIR:-/tmp/argus-gpu}:/run/argus-gpu
      - ${DATASET_DIR:-./data}:/data/images
      # Resolve argus-quarry's published symlinks (they point into the raw pool).
      - ${QUARRY_HOME:-./quarry}:/data/quarry:ro
      - ${OUTPUT_DIR:-./out}:/data/out
      - ${HOME}/.cache/argus_curator:/root/.cache/argus_curator
      - ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
      - ${HOME}/.insightface:/root/.insightface
    restart: unless-stopped

  # NudeNet detector server (AGPL-3.0, notAI-tech/NudeNet). Curator only talks to
  # it over HTTP, as http://nudenet:8080; no port is published. Pinned by digest
  # because upstream publishes only `latest`, and it is amd64 only.
  nudenet:
    profiles: ["curator", "forge", "full", "darkroom"]
    image: ghcr.io/notai-tech/nudenet@sha256:5d8fb3a20980680b73b7776745ee5b1983851c201a706cbdf3dd827c143783e9
    # The image's start command runs `ulimit -n 1000000 && <worker> & <api>`.
    # Where Docker's default limit is lower that ulimit fails, the inference
    # worker never starts and the API waits for warmup forever.
    ulimits:
      nofile: 1000000
    restart: unless-stopped

  # ── Training bridge (export -> ready-to-run LoRA training configs) ──────
  # Consumes a curator export (images + manifest.jsonl + .txt sidecars) and
  # writes kohya / OneTrainer / diffusers configs under <export>/forge/.
  # Backs the /forge page, which the /curate export flow links to on success.
  argus-forge:
    profiles: ["forge", "full"]
    # Demo-safe by default: the image refuses live POST /run training unless
    # explicitly enabled (needs a GPU + sd-scripts). See argus-halo#7.
    image: ghcr.io/smk762/argus-forge:${FORGE_TAG:-latest}
    ports:
      - "${FORGE_PORT:-8103}:8103"
    environment:
      # Same deal as CURATOR_CORS_ORIGINS above: default mirrors the image's
      # --cors (localhost:3000); add other browser origins comma-separated.
      - FORGE_CORS_ORIGINS=${FORGE_CORS_ORIGINS:-http://localhost:3000}
    volumes:
      # ro: only read here — source images + the caption sidecars lens wrote
      # next to them (forge copies those into the export dir).
      - ${DATASET_DIR:-./data}:/data/images:ro
      # Resolve argus-quarry's published symlinks (they point into the raw pool).
      - ${QUARRY_HOME:-./quarry}:/data/quarry:ro
      # Exports live here; configs land under <export>/forge/<trainer>/.
      - ${OUTPUT_DIR:-./out}:/data/out
    restart: unless-stopped

  # ── Post-training evaluation (LoRA in, scored verdicts out) ─────────────
  # Post-training LoRA eval (smk762/argus-studio#6). Serves scored EvalReports on
  # :8104 (GET /reports, GET/PUT /report/{id}, POST /report/{id}/hitl), triggers
  # generation+scoring runs (POST /run/stream against the configured backend),
  # and serves the generated samples (GET /report/{id}/image/{id}) — the backend
  # for the studio /proof review view. Reads the dataset + exports; writes eval
  # runs + reports under /data/out/proof/.
  argus-proof:
    profiles: ["proof", "full"]
    # Default: pull the published image (baked EXTRAS=server,cli). For the full
    # scorer stack (PROOF_EXTRAS=server,cli,score) build via compose.build.yaml.
    # Demo-safe: live GPU eval (POST /run/stream) 403s by default (argus-halo#7).
    image: ghcr.io/smk762/argus-proof:${PROOF_TAG:-latest}
    ports:
      - "${PROOF_PORT:-8104}:8104"
    environment:
      # Where the report store reads/writes <run_id>.json (under the mounted
      # output volume, so reviews persist across restarts).
      ARGUS_PROOF_REPORTS_DIR: /data/out/proof/reports
      # Generated runs (<run_id>/manifest.json + images) — also what
      # GET /report/{run_id}/image/{image_id} serves from.
      ARGUS_PROOF_RUNS_DIR: /data/out/proof/runs
      # Curator exports; GET /exports lists dirs with a manifest.jsonl here and
      # POST /run/stream name-resolves its `export` field under this root.
      ARGUS_PROOF_EXPORTS_DIR: /data/out
      # Generation backend: a ComfyUI reachable FROM THE CONTAINER. The default
      # targets a ComfyUI on the compose host (see extra_hosts below).
      PROOF_BACKEND: ${PROOF_BACKEND:-comfyui}
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-http://host.docker.internal:8188}
      # Checkpoints/LoRAs (mounted below) — resolved + SHA256-pinned into run
      # manifests, and listed by GET /models (checkpoints/ + loras/ layout).
      # Two roots (PATH-style) mirror ComfyUI's main + extra_model_paths trees;
      # with MODELS_EXTRA_DIR unset both point at the same tree (harmless).
      PROOF_MODELS_DIR: /data/models:/data/models-extra
    volumes:
      # ro: proof only reads the curated source images (score references).
      - ${DATASET_DIR:-./data}:/data/images:ro
      # Resolve argus-quarry's published symlinks (they point into the raw pool).
      - ${QUARRY_HOME:-./quarry}:/data/quarry:ro
      # Exports live here; eval runs + reports land under /data/out/proof/.
      - ${OUTPUT_DIR:-./out}:/data/out
      # ro: the generation engine's model tree(s) (same files ComfyUI loads), so
      # run manifests pin the exact weights. Point MODELS_DIR (and, if ComfyUI
      # uses extra_model_paths, MODELS_EXTRA_DIR) at them in .env.
      - ${MODELS_DIR:-./models}:/data/models:ro
      - ${MODELS_EXTRA_DIR:-${MODELS_DIR:-./models}}:/data/models-extra:ro
    extra_hosts:
      # Reach a ComfyUI running on the compose host at host.docker.internal.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  argus-atlas:
    profiles: ["atlas", "full"]
    # Bakes one georeferenced fantasy-map overlay from a DEM: GDAL controls ->
    # ComfyUI restyle -> alignment gate -> PMTiles. The image ships GDAL 3.11.
    # Demo-safe: POST /bake/stream 403s unless ATLAS_ALLOW_BAKE=1, and the
    # server never fetches OSM unless ATLAS_ALLOW_OSM=1. POST /controls and
    # POST /tiles are GDAL-only and always allowed.
    image: ghcr.io/smk762/argus-atlas:${ATLAS_TAG:-0.3.0a1}
    ports:
      - "${ATLAS_PORT:-8105}:8105"
    environment:
      # The image's defaults, restated: jobs under the shared output volume,
      # DEMs/vectors/OSM extracts under /data/dem, models read-only.
      ATLAS_JOBS_DIR: /data/out/atlas
      ATLAS_DEM_DIR: /data/dem
      ATLAS_MODELS_DIR: /data/models
      ATLAS_ALLOW_BAKE: ${ATLAS_ALLOW_BAKE:-}
      ATLAS_ALLOW_OSM: ${ATLAS_ALLOW_OSM:-}
      ATLAS_OVERPASS_URL: ${ATLAS_OVERPASS_URL:-}
      # A ComfyUI reachable FROM THE CONTAINER (see extra_hosts below). Shared
      # with argus-proof, which bakes through the same engine.
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-http://host.docker.internal:8188}
      # The image's --cors allows http://localhost:3000; widen for a LAN origin.
      ATLAS_CORS_ORIGINS: ${ATLAS_CORS_ORIGINS:-http://localhost:3000}
    volumes:
      # RW: POST /osm (when allowed) writes extracts under /data/dem/osm/.
      - ${DEM_DIR:-./dem}:/data/dem
      - ${OUTPUT_DIR:-./out}:/data/out
      # ro: the same checkpoints/ + loras/ tree ComfyUI loads, so each bake
      # SHA256-pins its weights.
      - ${MODELS_DIR:-./models}:/data/models:ro
      # Optional, ro: style recipes (<name>.json) for the CLI's `chunk` and
      # `chunks --recipe <name>`, which look under /data/recipes. No API route
      # reads them. Unset, this is an empty ./recipes, which changes nothing.
      - ${ATLAS_RECIPES_DIR:-./recipes}:/data/recipes:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  argus-survey:
    profiles: ["survey"]
    # Point clouds -> survey deliverables (QA, ground, DTM/DSM, contours, volumes,
    # change, ASPRS accuracy). Not part of `full`: a separate audience (land
    # surveyors), driven by its own UI below rather than a studio page.
    # Not on GHCR yet: run this profile with compose.build.yaml (builds ../argus-survey).
    image: ghcr.io/smk762/argus-survey:${SURVEY_TAG:-latest}
    user: "${UID:-1000}:${GID:-1000}"
    command: [argus-survey, serve, --host, 0.0.0.0, --port, "8107", --cors]
    ports:
      - "${SURVEY_PORT:-8107}:8107"
    environment:
      HOME: /tmp
      SURVEY_ALLOW_PROCESS: ${SURVEY_ALLOW_PROCESS:-}
      # The browser origin of argus-sightline.
      SURVEY_CORS_ORIGINS: ${SURVEY_CORS_ORIGINS:-http://localhost:3107}
    volumes:
      # Inputs read-only (argus-survey never modifies them); jobs under the shared output volume.
      # Create both first (`mkdir -p survey-in out/survey`): docker would make missing ones root-owned.
      - ${SURVEY_IN_DIR:-./survey-in}:/data/in:ro
      - ${OUTPUT_DIR:-./out}/survey:/data/jobs
    restart: unless-stopped

  argus-sightline:
    profiles: ["survey"]
    image: ghcr.io/smk762/argus-sightline:${SIGHTLINE_TAG:-latest}
    ports:
      - "${SIGHTLINE_PORT:-3107}:3000"
    environment:
      # As the browser reaches the API, not a compose DNS name.
      ARGUS_SURVEY_URL: ${ARGUS_SURVEY_URL-http://localhost:8107}
      ARGUS_STUDIO_URL: ${ARGUS_STUDIO_URL-http://localhost:3000}
    depends_on: [argus-survey]
    restart: unless-stopped

  argus-darkroom:
    # Guarded generation: a prompt is checked before anything renders, each
    # output is checked twice and then released or destroyed, and every attempt
    # keeps a record. Not in "full": it refuses to start without a SingGuard URL,
    # and no SingGuard is bundled here. The URL has no `:?` guard either, because
    # that would fail every other profile too.
    profiles: ["darkroom"]
    image: ghcr.io/smk762/argus-darkroom:${DARKROOM_TAG:-0.1.1}
    ports:
      # Loopback by default: darkroom is not for public hosting.
      - "${DARKROOM_PUBLISH:-127.0.0.1:8106}:8106"
    environment:
      ARGUS_DARKROOM_SINGGUARD_URL: ${DARKROOM_SINGGUARD_URL:-${SINGGUARD_URL:-}}
      # Shared with argus-proof and argus-atlas.
      ARGUS_DARKROOM_COMFYUI_URL: ${COMFYUI_BASE_URL:-http://host.docker.internal:8188}
      # Unset: the bundled nudenet service. Set empty: SFW generation is refused,
      # since every SFW output would be omitted.
      ARGUS_DARKROOM_NUDENET_URL: ${DARKROOM_NUDENET_URL-http://nudenet:8080}
      # Curator's POST /faces?body=true. Empty: records carry no age check.
      ARGUS_DARKROOM_AGE_URL: ${DARKROOM_AGE_URL:-}
      ARGUS_DARKROOM_OLLAMA_URL: ${DARKROOM_OLLAMA_URL:-}
      ARGUS_DARKROOM_OLLAMA_MODEL: ${DARKROOM_OLLAMA_MODEL:-}
      ARGUS_DARKROOM_THINKING: ${DARKROOM_THINKING:-cascade}
      # The checkpoint a form starts on: a name, or a folder under checkpoints/.
      ARGUS_DARKROOM_DEFAULT_CHECKPOINT: ${DARKROOM_DEFAULT_CHECKPOINT:-sdxl}
      ARGUS_DARKROOM_ALLOW_NSFW: ${DARKROOM_ALLOW_NSFW:-0}
      ARGUS_DARKROOM_READ_ONLY: ${DARKROOM_READ_ONLY:-0}
      # Adds the purge routes behind /darkroom's Delete record and Delete everything.
      ARGUS_DARKROOM_DEVMODE: ${DARKROOM_DEVMODE-${ARGUS_DEVMODE-${DEVMODE:-}}}
      # Name each origin: a wildcard allows reads and refuses every write.
      ARGUS_DARKROOM_CORS_ORIGINS: ${DARKROOM_CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - argus-darkroom:/data
      # ro: the checkpoints/ + loras/ tree ComfyUI lists, hashed for the record.
      # With extra_model_paths, that can differ from MODELS_DIR.
      - ${DARKROOM_MODELS_DIR:-${MODELS_DIR:-./models}}:/models:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ── Upstream acquisition (run-to-completion job, not a server) ──────────
  # Fetches PD/CC0 images into its own pool at /data/quarry/images, then
  # publishes a curator-ready <category>/<subject>/ tree into DATASET_DIR
  # (symlinks by default -> hence the read-only /data/quarry mount on
  # curator/lens above). Add --category identity|wardrobe|setting|concept to
  # the command below to harvest a single category instead of all four.
  argus-quarry:
    profiles: ["gallery"]
    # Same published image as argus-quarry-server (baked EXTRAS=cli,phash,server);
    # here it runs the acquisition job via the command override below.
    image: ghcr.io/smk762/argus-quarry:${QUARRY_TAG:-latest}
    environment:
      - QUARRY_HOME=/data/quarry
      # --export publishes to $DATASET_DIR *as seen inside the container* (the
      # CLI falls back to ./data otherwise, which lands in the container FS and
      # is lost). Must match the /data/images mount below.
      - DATASET_DIR=/data/images
      - QUARRY_MAX_GB=${QUARRY_MAX_GB:-40}         # total raw-pool ceiling; 0 = unlimited
      - COMMONS_USER_AGENT=${COMMONS_USER_AGENT:-argus-quarry/0.2 (contact@example.com)}
    volumes:
      - ${QUARRY_HOME:-./quarry}:/data/quarry       # raw pool + db/cache/logs
      - ${DATASET_DIR:-./data}:/data/images         # published (curator-ready) view
    # Fetch into the pool, then publish a CC0/PD tree into DATASET_DIR. --copy
    # publishes real files instead of symlinks: symlink targets are absolute
    # pool paths that don't resolve inside the curator/lens containers.
    command: ["run", "--source", "commons", "--limit", "20", "--export", "--copy", "--licence", "CC0,PD"]
    restart: "no"

  # ── Provenance viewer (read-only API behind the /gallery page) ──────────
  # Serves subjects / photos / licence / attribution queries from quarry's
  # sqlite provenance DB, plus pooled-image thumbnails. Read-only by design.
  argus-quarry-server:
    profiles: ["gallery", "full"]
    image: ghcr.io/smk762/argus-quarry:${QUARRY_TAG:-latest}
    ports:
      - "${QUARRY_SERVER_PORT:-8102}:8102"
    environment:
      - QUARRY_HOME=/data/quarry
      # Public-domain metadata archives for /gallery's Sources view (links,
      # captions, sizes — no photos; see argus-quarry's
      # scripts/fetch_public_domain_metadata.py). Index them once with
      #   docker compose run --rm argus-quarry-server archives index
      - QUARRY_PD12M_DIR=/data/public_domain/pd12m
      - QUARRY_MEGALITH_DIR=/data/public_domain/megalith
      # Opt-in: let the Sources view land a slice in the pool itself. Unset,
      # the page hands back slice.json + the CLI command instead (demo-safe).
      - QUARRY_ALLOW_FETCH=${QUARRY_ALLOW_FETCH:-}
      # The fetch button POSTs cross-origin, and quarry never grants POST to
      # its default "*" CORS: list the studio origin(s) to use it (>= 0.3.1).
      # Unset keeps --cors's read-only "*".
      - QUARRY_CORS_ORIGINS=${QUARRY_CORS_ORIGINS:-}
      # A server-side slice fetch obeys the same pool ceiling as the job.
      - QUARRY_MAX_GB=${QUARRY_MAX_GB:-40}
    volumes:
      # rw: the sqlite provenance DB uses WAL, which needs write access even
      # for readers; slice fetches land here, and the archive search indexes
      # are cached under cache/archives/.
      - ${QUARRY_HOME:-./quarry}:/data/quarry
      # ro: the archives are only read (and indexed into QUARRY_HOME).
      - ${PUBLIC_DOMAIN_DIR:-./public_domain}:/data/public_domain:ro
    command: ["serve", "--host", "0.0.0.0", "--port", "8102", "--cors"]
    restart: unless-stopped

volumes:
  argus-darkroom:
  ollama:
    name: argus-ollama
