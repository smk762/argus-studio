# Optional NVIDIA GPU override. Requires the NVIDIA Container Toolkit on the host.
#
#   docker compose -f compose.yaml -f compose.gpu.yaml --profile full up
#
# Layers on the default (published-image) path. To build the GPU backends from
# source instead, add the build override too:
#   docker compose -f compose.yaml -f compose.build.yaml -f compose.gpu.yaml --profile full up --build
#
# A source build of the curator also needs CURATOR_GPU=1 in .env: the image tag
# below says -gpu whatever was built.
#
# Lens and curator share the card through a lock file, one job at a time. Set
# ARGUS_GPU_COORDINATOR=none in .env to turn that off.
#
# Kept separate so the base stack runs on any machine (CPU-only, no toolkit).
services:
  argus-lens:
    environment:
      - ARGUS_GPU_COORDINATOR=${ARGUS_GPU_COORDINATOR:-lease}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  argus-curator:
    # The default image is CPU only, so reserving a GPU for it does nothing.
    image: ghcr.io/smk762/argus-curator:${CURATOR_TAG:-latest}-gpu
    environment:
      - ARGUS_GPU_COORDINATOR=${ARGUS_GPU_COORDINATOR:-lease}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
